spring:
  application:
    name: driver-service

  datasource:
    url: ${PG_URL}/driver_service_db
    username: ${PG_USERNAME}
    password: ${PG_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  kafka:
    bootstrap-servers: localhost:29092
    schema-registry:
      url: http://localhost:8081
    groups:
      driver-rating: driver-rating-group
    topics:
      rate-driver: rate-driver-topic
    consumers-number: 3
    error-handler:
      backoff:
        min-interval: 1000
        max-interval: 10000
        multiplier: 2.0

springdoc:
  api-docs:
    path: /api/v1/drivers/docs/v3/api-docs
  swagger-ui:
    path: /api/v1/drivers/docs/swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost

server:
  port: 8092
