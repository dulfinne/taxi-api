spring:
  application:
    name: payment-service

  datasource:
    url: ${PG_URL}/payment_service_db
    username: ${PG_USERNAME}
    password: ${PG_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  kafka:
    bootstrap-servers: localhost:29092
    schema-registry:
      url: http://localhost:8081
    groups:
      ride-payment: ride-payment-group
    topics:
      ride-payment: ride-payment-topic
    consumers-number: 3
    error-handler:
      backoff:
        min-interval: 1000
        max-interval: 10000
        multiplier: 2.0

springdoc:
  api-docs:
    path: /api/v1/payments/docs/v3/api-docs
  swagger-ui:
    path: /api/v1/payments/docs/swagger-ui.html

management:
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

scheduler:
  debt-repayment:
    cron: 0 0 0 * * *

server:
  port: 8096
