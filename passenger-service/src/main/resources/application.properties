spring.application.name=passenger-service
server.port=8091

spring.datasource.url=${PG_URL}/passenger_service_db
spring.datasource.username=${PG_USERNAME}
spring.datasource.password=${PG_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.schema-registry.url=http://localhost:8081
spring.kafka.groups.passenger-rating=passenger-rating-group
spring.kafka.topics.rate-passenger=rate-passenger-topic
spring.kafka.consumers-number=3
spring.kafka.error-handler.backoff.min-interval=1000
spring.kafka.error-handler.backoff.max-interval=10000
spring.kafka.error-handler.backoff.multiplier=2.0

springdoc.api-docs.path=/api/v1/passengers/docs/v3/api-docs
springdoc.swagger-ui.path=/api/v1/passengers/docs/swagger-ui.html

management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://tracing-server:9411/api/v2/spans
