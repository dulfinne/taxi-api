spring:
  application:
    name: auth-service
server:
  port: 8094

app:
  keycloak:
    client:
      id: springsecurity
      secret: ${KEYCLOAK_CLIENT_SECRET:egD63JWeQQLVP7OY8P2qAPR5eIwvR5Zp}
    realm: taxi
    server-url: http://localhost:8080

springdoc:
  api-docs:
    path: /api/v1/auth/docs/v3/api-docs
  swagger-ui:
    path: /api/v1/auth/docs/swagger-ui.html

management:
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/